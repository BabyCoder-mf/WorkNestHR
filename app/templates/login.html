{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header card-header-custom text-center py-4">
                    <img src="{{ url_for('static', filename='images/logo.png') }}"
                         alt="WorkNest HR Logo"
                         class="img-fluid mb-3"
                         style="max-height: 100px;">
                    <h4 class="mb-0">Employee Login</h4>
                </div>
                <div class="card-body p-4">
                    <!-- Camera Preview -->
                    <div class="mb-4 text-center" id="cameraSection" style="display: none;">
                        <video id="video" width="100%" height="300" autoplay class="border rounded"></video>
                        <canvas id="canvas" style="display: none;"></canvas>
                        <div class="mt-3">
                            <button id="captureBtn" class="btn btn-success btn-lg">
                                <i class="bi bi-camera"></i> Capture Photo
                            </button>
                        </div>
                    </div>

                    <!-- Face Recognition Login Button -->
                    <div class="d-grid mb-4" id="startButtonSection">
                        <button class="btn btn-primary btn-lg py-3" onclick="startFaceRecognition()">
                            <i class="bi bi-camera"></i> Start Face Recognition
                        </button>
                    </div>

                    <!-- Divider -->
                    <div class="text-center mb-4">
                        <span class="text-muted">OR</span>
                    </div>

                    <!-- PIN Login Form -->
                    <form id="pinLoginForm">
                        <div class="mb-3">
                            <label for="employeeId" class="form-label">Employee ID</label>
                            <input type="text" class="form-control" id="employeeId"
                                   placeholder="Enter your employee ID" required>
                        </div>
                        <div class="mb-4">
                            <label for="pin" class="form-label">4-Digit PIN</label>
                            <input type="password" class="form-control" id="pin"
                                   maxlength="4" pattern="[0-9]{4}"
                                   placeholder="Enter 4-digit PIN" required>
                        </div>
                        <button type="submit" class="btn btn-secondary w-100 py-2">
                            <i class="bi bi-key"></i> Login with PIN
                        </button>
                    </form>

                    <!-- Login Result -->
                    <div id="loginResult" class="mt-3"></div>
                </div>
            </div>

            <!-- Back to Home -->
            <div class="text-center mt-4">
                <a href="{{ url_for('main.index') }}" class="text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>
</div>

<script>
let stream = null;
let capturedImage = null;

// Handle PIN login form - CLEAN VERSION
document.getElementById('pinLoginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const employeeId = document.getElementById('employeeId').value.trim();
    const pin = document.getElementById('pin').value.trim();

    // Simple validation
    if (!employeeId || !pin) {
        showLoginMessage('Please enter Employee ID and PIN', 'warning');
        return;
    }

    // Show loading
    showLoginMessage('Logging in...', 'info', true);

    try {
        console.log(`Sending login: ${employeeId}`);

        const response = await fetch('/api/pin-login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ employee_id: employeeId, pin: pin })
        });

        const result = await response.json();
        console.log('Login response:', result);

        if (result.success) {
            showLoginMessage(`Welcome ${result.staff.name}! Redirecting...`, 'success');

            // ALWAYS redirect to profile for employee login
            setTimeout(() => {
                window.location.href = '/profile';
            }, 1000);

        } else {
            showLoginMessage(result.message || 'Login failed', 'error');
        }

    } catch (error) {
        console.error('Login error:', error);
        showLoginMessage(`Network error: ${error.message}`, 'error');
    }
});

// Start Face Recognition
async function startFaceRecognition() {
    showLoginMessage('Initializing camera...', 'info', true);

    try {
        // Initialize camera
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: 'user',
                width: { ideal: 640 },
                height: { ideal: 480 }
            }
        });

        const video = document.getElementById('video');
        video.srcObject = stream;

        // Show camera section, hide start button
        document.getElementById('cameraSection').style.display = 'block';
        document.getElementById('startButtonSection').style.display = 'none';

        showLoginMessage('Camera ready! Click "Capture Photo" to take picture.', 'info');

    } catch (error) {
        console.error('Camera error:', error);
        showLoginMessage(`Camera error: ${error.message}`, 'error');
    }
}

// Capture photo
document.getElementById('captureBtn').addEventListener('click', function() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    // Convert to base64
    capturedImage = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

    // Stop camera
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    // Show camera section
    document.getElementById('cameraSection').style.display = 'none';
    document.getElementById('startButtonSection').style.display = 'block';

    // Show processing message
    showLoginMessage('Processing face recognition...', 'info', true);

    // Send to backend for face recognition
    processFaceRecognition();
});

// Process face recognition with backend
async function processFaceRecognition() {
    try {
        const response = await fetch('/api/face-login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ image_data: capturedImage })
        });

        const result = await response.json();

        if (result.success) {
            if (result.already_checked_in) {
                // Auto-redirect to profile page
                window.location.href = '/profile';
            } else {
                // Show success message
                showFaceLoginSuccess(result);
            }
        } else {
            showLoginMessage(result.message || 'Face recognition failed', 'error');
        }

    } catch (error) {
        console.error('Face login error:', error);
        showLoginMessage(`Face recognition error: ${error.message}`, 'error');
    }
}

// Show face login success
function showFaceLoginSuccess(result) {
    const html = `
        <div class="alert alert-success">
            <div class="text-center">
                <i class="bi bi-check-circle-fill display-4 text-success mb-3"></i>
                <h4>Attendance Confirmed!</h4>
                <p class="mb-2"><strong>${result.staff.name}</strong></p>
                <p class="mb-2">${result.staff.department} Department</p>
                <p class="mb-2">Employee ID: ${result.staff.employee_id}</p>
                <p class="mb-1"><small>Confidence: ${result.confidence}%</small></p>
                <hr>
                <p class="text-muted"><small>Redirecting to profile...</small></p>
            </div>
        </div>
    `;

    document.getElementById('loginResult').innerHTML = html;

    // Auto-redirect after 2 seconds
    setTimeout(() => {
        window.location.href = '/profile';
    }, 2000);
}

// Helper function to show login messages
function showLoginMessage(message, type = 'info', showSpinner = false) {
    const resultDiv = document.getElementById('loginResult');

    let icon = '';
    let bgClass = '';

    switch(type) {
        case 'success':
            icon = 'bi-check-circle';
            bgClass = 'alert-success';
            break;
        case 'error':
        case 'danger':
            icon = 'bi-exclamation-triangle';
            bgClass = 'alert-danger';
            break;
        case 'warning':
            icon = 'bi-exclamation-circle';
            bgClass = 'alert-warning';
            break;
        default:
            icon = 'bi-info-circle';
            bgClass = 'alert-info';
    }

    const spinner = showSpinner ?
        '<div class="spinner-border spinner-border-sm me-2" role="status"></div>' :
        `<i class="bi ${icon} me-2"></i>`;

    resultDiv.innerHTML = `
        <div class="alert ${bgClass}">
            <div class="d-flex align-items-center">
                ${spinner}
                <span>${message}</span>
            </div>
        </div>
    `;
}

// Stop camera when leaving page
window.addEventListener('beforeunload', () => {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }
});
</script>
{% endblock %}
