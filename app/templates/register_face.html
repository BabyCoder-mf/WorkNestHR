{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark text-center py-4">
                    <h4 class="mb-0">Register Your Face</h4>
                    <small>Admin Only - Register test face for system</small>
                </div>
                <div class="card-body p-4">
                    <!-- Camera Preview -->
                    <div class="mb-4 text-center">
                        <video id="video" width="100%" height="300" autoplay class="border rounded"></video>
                        <canvas id="canvas" style="display: none;"></canvas>
                    </div>

                    <!-- Capture Button -->
                    <div class="d-grid mb-4">
                        <button id="captureBtn" class="btn btn-warning btn-lg">
                            <i class="bi bi-camera"></i> Capture Photo
                        </button>
                    </div>

                    <!-- Staff Selection -->
                    <div class="mb-3">
                        <label for="staffSelect" class="form-label">Select Staff Member</label>
                        <select id="staffSelect" class="form-select">
                            <option value="">-- Select Staff --</option>
                        </select>
                    </div>

                    <!-- Register Button -->
                    <div class="d-grid">
                        <button id="registerBtn" class="btn btn-primary" disabled>
                            <i class="bi bi-person-plus"></i> Register Face
                        </button>
                    </div>

                    <!-- Result -->
                    <div id="registerResult" class="mt-3"></div>

                    <!-- Preview -->
                    <div id="preview" class="mt-3 text-center" style="display: none;">
                        <img id="previewImage" src="" alt="Captured Photo" class="img-fluid rounded border" style="max-height: 200px;">
                    </div>
                </div>
            </div>

            <!-- Back to Home -->
            <div class="text-center mt-4">
                <a href="{{ url_for('main.index') }}" class="text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>
</div>

<script>
let stream = null;
let capturedImage = null;

// Initialize camera
async function initCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('video').srcObject = stream;
    } catch (error) {
        document.getElementById('registerResult').innerHTML = `
            <div class="alert alert-danger">
                Camera error: ${error.message}
            </div>
        `;
    }
}

// Capture photo
document.getElementById('captureBtn').addEventListener('click', function() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    // Convert to base64
    capturedImage = canvas.toDataURL('image/jpeg').split(',')[1];

    // Show preview
    document.getElementById('previewImage').src = 'data:image/jpeg;base64,' + capturedImage;
    document.getElementById('preview').style.display = 'block';
    document.getElementById('registerBtn').disabled = false;

    document.getElementById('registerResult').innerHTML = `
        <div class="alert alert-success">
            Photo captured successfully! Click "Register Face" to save.
        </div>
    `;
});

// Load staff members
async function loadStaff() {
    try {
        const response = await fetch('/api/get-staff');
        const staff = await response.json();

        const select = document.getElementById('staffSelect');
        staff.forEach(s => {
            const option = document.createElement('option');
            option.value = s.id;
            option.textContent = `${s.name} (${s.employee_id})`;
            select.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading staff:', error);
    }
}

// Register face
document.getElementById('registerBtn').addEventListener('click', async function() {
    const staffId = document.getElementById('staffSelect').value;

    if (!staffId || !capturedImage) {
        alert('Please select staff and capture photo first');
        return;
    }

    document.getElementById('registerResult').innerHTML = `
        <div class="alert alert-info">
            <div class="d-flex align-items-center">
                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                <span>Registering face with Imgur and Face++...</span>
            </div>
        </div>
    `;

    try {
        const response = await fetch('/api/register-face-imgur', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                staff_id: staffId,
                image_data: capturedImage
            })
        });

        const result = await response.json();

        if (result.success) {
            document.getElementById('registerResult').innerHTML = `
                <div class="alert alert-success">
                    <strong>✅ Face registered successfully!</strong><br>
                    <small>Imgur URL: ${result.image_url}</small><br>
                    <small>Staff can now login with face recognition</small>
                </div>
            `;
        } else {
            document.getElementById('registerResult').innerHTML = `
                <div class="alert alert-danger">
                    <strong>❌ Registration failed:</strong><br>
                    ${result.message}
                </div>
            `;
        }
    } catch (error) {
        document.getElementById('registerResult').innerHTML = `
            <div class="alert alert-danger">
                <strong>❌ Error:</strong><br>
                ${error.message}
            </div>
        `;
    }
});

// Stop camera when leaving
window.addEventListener('beforeunload', () => {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
});

// Initialize
initCamera();
loadStaff();
</script>
{% endblock %}
