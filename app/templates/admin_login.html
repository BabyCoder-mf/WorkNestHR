{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header card-header-custom text-center py-4">
                    <img src="{{ url_for('static', filename='images/logo.png') }}"
                         alt="WorkNest HR Logo"
                         class="img-fluid mb-3"
                         style="max-height: 60px;">
                    <h4 class="mb-0">Admin Login</h4>
                </div>
                <div class="card-body p-4">
                    <!-- PIN Login Form -->
                    <form id="adminLoginForm">
                        <div class="mb-3">
                            <label for="adminUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="adminUsername"
                                   placeholder="Enter admin username" required>
                        </div>
                        <div class="mb-4">
                            <label for="adminPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="adminPassword"
                                   placeholder="Enter PIN (1234)" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-shield-lock"></i> Admin Login
                        </button>
                    </form>

                    <!-- Face Recognition Option -->
                    <div class="text-center my-4">
                        <hr>
                        <p class="text-muted mb-3">Or login with face recognition</p>
                        <button class="btn btn-outline-primary w-100 py-2" onclick="startAdminFaceLogin()">
                            <i class="bi bi-camera"></i> Face Recognition Login
                        </button>
                    </div>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('main.login') }}" class="text-decoration-none">
                            <i class="bi bi-arrow-left"></i> Employee Login
                        </a>
                    </div>

                    <div id="adminLoginResult" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Camera Modal for Face Recognition -->
<div class="modal fade" id="adminCameraModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Admin Face Recognition</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <div id="adminCameraContainer">
                    <video id="adminCamera" autoplay playsinline width="400" height="300" class="rounded"></video>
                </div>
                <div class="mt-3">
                    <button class="btn btn-success me-2" onclick="captureAdminFace()">
                        <i class="bi bi-camera-fill"></i> Capture & Login
                    </button>
                    <button class="btn btn-secondary" onclick="stopAdminCamera()">
                        <i class="bi bi-x-circle"></i> Cancel
                    </button>
                </div>
                <div id="adminFaceResult" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
// Admin Face Recognition
let adminStream = null;

// Start face recognition
async function startAdminFaceLogin() {
    try {
        // Access camera
        adminStream = await navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 400 },
                height: { ideal: 300 },
                facingMode: "user"
            }
        });

        const video = document.getElementById('adminCamera');
        video.srcObject = adminStream;

        // Show modal
        const modal = new bootstrap.Modal(document.getElementById('adminCameraModal'));
        modal.show();

    } catch (error) {
        alert('Error accessing camera: ' + error.message);
    }
}

// Capture face and login
async function captureAdminFace() {
    const video = document.getElementById('adminCamera');
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imageData = canvas.toDataURL('image/jpeg');

    // Show loading
    document.getElementById('adminFaceResult').innerHTML = `
        <div class="alert alert-info">
            <i class="bi bi-hourglass-split"></i> Verifying admin identity...
        </div>
    `;

    try {
        const response = await fetch('/api/admin-face-login-separate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                image_data: imageData.split(',')[1]
            })
        });

        const result = await response.json();

        if (result.success) {
            document.getElementById('adminFaceResult').innerHTML = `
                <div class="alert alert-success">
                    <i class="bi bi-check-circle"></i> ${result.message}
                </div>
            `;

            // Redirect to admin dashboard
            setTimeout(() => {
                stopAdminCamera();
                window.location.href = '/admin/dashboard';
            }, 1500);
        } else {
            document.getElementById('adminFaceResult').innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle"></i> ${result.message}
                </div>
            `;
        }
    } catch (error) {
        document.getElementById('adminFaceResult').innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle"></i> Login error: ${error.message}
            </div>
        `;
    }
}

// Stop camera
function stopAdminCamera() {
    if (adminStream) {
        adminStream.getTracks().forEach(track => track.stop());
        adminStream = null;
    }
    const modal = bootstrap.Modal.getInstance(document.getElementById('adminCameraModal'));
    modal.hide();
}

// Stop camera when modal closes
document.getElementById('adminCameraModal').addEventListener('hidden.bs.modal', function() {
    stopAdminCamera();
});


// PIN Login Form Handler
// PIN Login Form Handler
document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('adminUsername').value;
    const password = document.getElementById('adminPassword').value;

    console.log('Attempting login with:', { username, password });

    // Show loading
    document.getElementById('adminLoginResult').innerHTML = `
        <div class="alert alert-info">
            <i class="bi bi-hourglass-split"></i> Authenticating...
        </div>
    `;

    try {
        const response = await fetch('/api/admin-login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                username: username,
                pin: password
            })
        });

        console.log('Response status:', response.status);
        console.log('Response headers:', response.headers);

        // Check if response is JSON
        const contentType = response.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
            const text = await response.text();
            console.error('Non-JSON response:', text.substring(0, 200));
            throw new Error('Server returned HTML instead of JSON. Check the route.');
        }

        const result = await response.json();
        console.log('Login result:', result);

        if (result.success) {
            document.getElementById('adminLoginResult').innerHTML = `
                <div class="alert alert-success">
                    <i class="bi bi-check-circle"></i> ${result.message} Redirecting...
                </div>
            `;

            setTimeout(() => {
                window.location.href = '/admin/dashboard';
            }, 1500);
        } else {
            document.getElementById('adminLoginResult').innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle"></i> ${result.message}
                </div>
            `;
        }
    } catch (error) {
        console.error('Login error:', error);
        document.getElementById('adminLoginResult').innerHTML = `
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle"></i> Login error: ${error.message}
            </div>
        `;
    }
});
</script>
{% endblock %}
